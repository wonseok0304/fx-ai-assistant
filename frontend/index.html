<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>환율 AI 분석 비서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>💱 USD/KRW 환율 AI 분석 비서</h1>
    <button id="themeToggle" class="ghost" aria-label="다크 모드 전환">🌙</button>
  </header>

  <div id="wakeBanner" class="banner" hidden>
    ⏳ 서버를 깨우는 중입니다 (무료 서버는 첫 요청에 30~60초 걸릴 수 있어요)…
  </div>
  <div id="errorBanner" class="banner error" hidden></div>

  <main class="layout">
    <!-- 요약 -->
    <section class="card" id="summaryCard">
      <h2>데이터 요약</h2>
      <div id="summary" class="summary-grid">불러오는 중…</div>
    </section>

    <!-- 채팅 -->
    <section class="card chat">
      <div class="card-head">
        <h2>AI 채팅</h2>
        <button id="newChat" class="ghost">+ 새 대화</button>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="chatForm" class="chat-form">
        <input id="chatInput" maxlength="1000" placeholder="예: 최근 환율 추세가 어때?" autocomplete="off" required>
        <button id="sendBtn" type="submit">전송</button>
      </form>
    </section>

    <!-- 대화 기록 -->
    <section class="card">
      <h2>대화 기록</h2>
      <ul id="convList" class="list"></ul>
    </section>

    <!-- 그래프 -->
    <section class="card wide">
      <div class="card-head">
        <h2>환율 추이</h2>
        <span class="legend"><i class="dot raw"></i>일별 <i class="dot ma"></i>7일 이동평균</span>
      </div>
      <canvas id="chart" height="260"></canvas>
      <div id="chartTip" class="tip" hidden></div>
    </section>

    <!-- 데이터 관리 -->
    <section class="card wide">
      <div class="card-head">
        <h2>데이터 관리</h2>
        <span>
          <a id="exportCsv" class="btn ghost" href="#">CSV</a>
          <a id="exportJson" class="btn ghost" href="#">JSON</a>
        </span>
      </div>
      <form id="dataForm" class="data-form">
        <input type="hidden" id="dataId">
        <label>날짜 <input type="date" id="dDate" required></label>
        <label>환율(원) <input type="number" id="dValue" step="0.01" min="0.01" required></label>
        <label class="grow">메모 <input type="text" id="dMemo" maxlength="200"></label>
        <button type="submit" id="dSubmit">추가</button>
        <button type="button" id="dCancel" class="ghost" hidden>취소</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>날짜</th><th>환율</th><th>메모</th><th></th></tr></thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="prevPage" class="ghost">‹</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="ghost">›</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
